name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs exactly the SDK pinned in global.json (10.0.404).
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CareEMR.slnx

      - name: Build
        run: dotnet build CareEMR.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CareEMR.slnx --configuration Release --no-build --verbosity normal

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      # Throwaway random secrets, only for this CI run (never committed).
      - name: Create .env
        run: |
          {
            echo "POSTGRES_USER=careemr"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "POSTGRES_DB=careemr"
            echo "JWT_SIGNING_KEY=$(openssl rand -base64 48 | tr -d '\n')"
            echo "DEMO_USERNAME=demo"
            echo "DEMO_PASSWORD=$(openssl rand -hex 12)"
          } > .env

      - name: Start containers
        run: docker compose up --build --detach

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/patients || true)
            [ "$code" = "401" ] && echo "API is up" && exit 0
            sleep 2
          done
          echo "API did not start in time"; exit 1

      - name: Log in and call the API
        run: |
          set -a; . ./.env; set +a
          token=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$DEMO_USERNAME\",\"password\":\"$DEMO_PASSWORD\"}" | jq -r .accessToken)
          [ -n "$token" ] && [ "$token" != "null" ]

          # Fake test data only.
          curl -sf -X POST http://localhost:8080/api/patients \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"firstName":"Ci","lastName":"Smoke","dateOfBirth":"1990-01-01","healthCardNumber":"1234567890"}'
          echo
          count=$(curl -sf http://localhost:8080/api/patients -H "Authorization: Bearer $token" | jq length)
          echo "patients: $count"
          [ "$count" = "1" ]

          curl -sfL -o /dev/null http://localhost:8080/scalar && echo "Scalar docs OK"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
